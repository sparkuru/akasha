# Akasha local environment.
#
#   docker compose up app          # boot the minimal Elysia server on :3000
#   docker compose run --rm verify # one-off: install + typecheck + test + lint
#
# The repo is bind-mounted so edits are live; node_modules lives in an
# anonymous volume so the container's install is not clobbered by the host.
services:
  app:
    build:
      context: .
      target: dev
    image: akasha:dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - akasha_node_modules:/app/node_modules
    command: bun run dev

  # One-shot quality gate. Exits non-zero if any step fails.
  verify:
    build:
      context: .
      target: dev
    image: akasha:dev
    volumes:
      - .:/app
      - akasha_node_modules:/app/node_modules
    command: >
      sh -c "for i in 1 2 3 4 5; do bun install && break;
               echo retry install $$i; sleep 3; done &&
             bun run typecheck &&
             bun test &&
             bun run lint"

volumes:
  akasha_node_modules:
