services:
  akasha:
    build:
      context: .
      target: prod
    image: akasha:prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      AKASHA_CONFIG: /config/rclone.conf
      AKASHA_INDEX: /data/irminsul.json
    ports:
      - "${AKASHA_PORT:-3000}:3000"
    volumes:
      - ./deploy/config/rclone.conf:/config/rclone.conf:ro
      - akasha_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/remotes').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  akasha_data:
